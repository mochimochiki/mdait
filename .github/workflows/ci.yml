name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Compile TypeScript
      run: npm run compile
      
    - name: Run linting
      run: npm run lint
      
    - name: Run tests
      run: npm test
      
    # 検証の土台（mdait Lab）が生きていることを守る。ワークスペースは /tmp に作られるので
    # リポジトリを汚さない（ADR-260823-03）。sweep は sync の冪等性とマーカー整合を、
    # regress は録音の再生で指示文の組み立てが変わっていないことを見る。どちらも LLM を呼ばない。
    - name: Exploratory sweep (mdait Lab)
      run: npm run test:explore

    - name: Replay regression (mdait Lab)
      run: npm run test:byok:e2e

    - name: Bundle extension
      run: npm run bundle
      
    - name: Package extension
      run: npx @vscode/vsce package
      
    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: mdait-extension
        path: '*.vsix'
        retention-days: 30